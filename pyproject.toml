[project]
name = "backend"
version = "0.1.0"
description = "Django backend for JobsFinder with Scraping and DL modules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "psycopg2-binary",
    "selenium",
    "beautifulsoup4",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "transformers",
    "torch",
    "accelerate",
    "scikit-learn",
]

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.100.0",
]
